name: update-readme
run-name: updates the readme with the new entry after pull request is merged

on:
  pull_request:
    types:
      - closed

jobs:
  if_merged:
    name: "update readme"
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    with:
      ssh-key: ${{secrets.ACTION_PRIVKEY}}
    steps:
    - uses: actions/checkout@v4
    - run: "./update_readme.sh"
    - run: |
        # configure user
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        # stage any file changes to be committed
        git add .
        
        # make commit with staged changes
        git commit -m 'updated readme for ${{ github.sha }}'
        
        # push the commit back up to source GitHub repository
        git push